[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerodyne"
version = "0.1.0"
description = "AERODYNE - integrated high-power rocket engineering, simulation, avionics and flight-test platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
cad = ["gmsh>=4.11"]            # STEP import (needs libGLU on Linux)
serial = ["pyserial>=3.5"]      # ground radio on a serial port

[project.scripts]
aerodyne = "aerodyne.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
